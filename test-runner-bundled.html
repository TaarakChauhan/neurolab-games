/* ==========================================================================
   NEUROLAB - Game 11: Wordle Master
   Verbal deduction, lexical retrieval & working memory hypothesis testing
   ========================================================================== */

class WordleGame {
  constructor(container, onComplete) {
    this.container = container;
    this.onComplete = onComplete;
    this.wordList = [
      'BRAIN', 'SMART', 'LOGIC', 'FOCUS', 'THINK', 'SOLVE', 'PULSE', 'LEARN',
      'NEURO', 'SPARK', 'FLASH', 'QUICK', 'SHARP', 'POWER', 'SKILL', 'SOLAR',
      'LIGHT', 'STORM', 'TRAIN', 'DREAM', 'CHESS', 'FORCE', 'DISCO', 'CYBER',
      'CLOUD', 'BLOOM', 'MAGIC', 'NEXUS', 'PRISM', 'AUDIO', 'PIXEL', 'MATRIX'
    ];

    this.targetWord = this.wordList[Math.floor(Math.random() * this.wordList.length)];
    this.guesses = [];
    this.currentGuess = '';
    this.maxGuesses = 6;
    this.gameOverState = false;

    this.keyStates = {}; // letter -> 'correct' | 'present' | 'absent'

    this.render();
  }

  render() {
    this.container.innerHTML = `
      <div class="game-stage-wrapper">
        <div class="wordle-container">
          <div class="nback-status-pill">
            <span>Target: <strong>5-Letter Word</strong></span>
            <span>Attempts: <strong id="wordle-attempt">1</strong> / 6</span>
            <span id="wordle-msg" style="color:var(--cyan-primary); font-weight:600;">Type or tap letters</span>
          </div>

          <div class="wordle-grid" id="wordle-grid">
            ${Array.from({ length: 6 })
              .map(
                (_, r) => `
                <div class="wordle-row" data-row="${r}">
                  ${Array.from({ length: 5 })
                    .map((_, c) => `<div class="wordle-tile" data-col="${c}"></div>`)
                    .join('')}
                </div>
              `
              )
              .join('')}
          </div>

          <div class="wordle-keyboard" id="wordle-kb">
            <!-- 3 rows of keyboard -->
          </div>
        </div>
      </div>
    `;

    this.gridEl = this.container.querySelector('#wordle-grid');
    this.kbEl = this.container.querySelector('#wordle-kb');
    this.msgEl = this.container.querySelector('#wordle-msg');
    this.attemptEl = this.container.querySelector('#wordle-attempt');

    this.renderKeyboard();

    this.keyHandler = (e) => {
      if (this.gameOverState) return;
      if (e.key === 'Enter') {
        this.submitGuess();
      } else if (e.key === 'Backspace') {
        this.removeLetter();
      } else if (/^[a-zA-Z]$/.test(e.key)) {
        this.addLetter(e.key.toUpperCase());
      }
    };
    window.addEventListener('keydown', this.keyHandler);
  }

  renderKeyboard() {
    const layout = [
      ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
      ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
      ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL']
    ];

    this.kbEl.innerHTML = '';
    layout.forEach(row => {
      const rowEl = document.createElement('div');
      rowEl.className = 'wordle-kb-row';

      row.forEach(key => {
        const keyBtn = document.createElement('button');
        keyBtn.className = 'wordle-key';
        keyBtn.innerText = key;
        if (key === 'ENTER' || key === 'DEL') keyBtn.classList.add('wide');

        const state = this.keyStates[key];
        if (state) keyBtn.classList.add(state);

        keyBtn.addEventListener('click', () => {
          if (this.gameOverState) return;
          if (key === 'ENTER') this.submitGuess();
          else if (key === 'DEL') this.removeLetter();
          else this.addLetter(key);
        });

        rowEl.appendChild(keyBtn);
      });

      this.kbEl.appendChild(rowEl);
    });
  }

  addLetter(letter) {
    if (this.currentGuess.length < 5) {
      this.currentGuess += letter;
      this.updateCurrentRow();
      if (window.soundEngine) window.soundEngine.playTap(600);
    }
  }

  removeLetter() {
    if (this.currentGuess.length > 0) {
      this.currentGuess = this.currentGuess.slice(0, -1);
      this.updateCurrentRow();
      if (window.soundEngine) window.soundEngine.playTap(450);
    }
  }

  updateCurrentRow() {
    const rowIdx = this.guesses.length;
    const row = this.gridEl.querySelector(`.wordle-row[data-row="${rowIdx}"]`);
    if (!row) return;

    const tiles = row.querySelectorAll('.wordle-tile');
    tiles.forEach((t, i) => {
      const char = this.currentGuess[i] || '';
      t.innerText = char;
      t.classList.toggle('filled', char !== '');
    });
  }

  submitGuess() {
    if (this.currentGuess.length < 5) {
      this.msgEl.innerText = 'Not enough letters!';
      this.msgEl.style.color = 'var(--crimson-alert)';
      if (window.soundEngine) window.soundEngine.playError();
      return;
    }

    const rowIdx = this.guesses.length;
    const row = this.gridEl.querySelector(`.wordle-row[data-row="${rowIdx}"]`);
    const tiles = row.querySelectorAll('.wordle-tile');
    const guess = this.currentGuess;
    const target = this.targetWord;

    const evaluation = Array(5).fill('absent');
    const targetCounts = {};

    for (let char of target) {
      targetCounts[char] = (targetCounts[char] || 0) + 1;
    }

    // First pass: exact matches (green)
    for (let i = 0; i < 5; i++) {
      if (guess[i] === target[i]) {
        evaluation[i] = 'correct';
        targetCounts[guess[i]]--;
        this.keyStates[guess[i]] = 'correct';
      }
    }

    // Second pass: present matches (yellow)
    for (let i = 0; i < 5; i++) {
      if (evaluation[i] !== 'correct' && targetCounts[guess[i]] > 0) {
        evaluation[i] = 'present';
        targetCounts[guess[i]]--;
        if (this.keyStates[guess[i]] !== 'correct') {
          this.keyStates[guess[i]] = 'present';
        }
      } else if (evaluation[i] !== 'correct') {
        if (!this.keyStates[guess[i]]) {
          this.keyStates[guess[i]] = 'absent';
        }
      }
    }

    // Animate tiles
    tiles.forEach((t, i) => {
      setTimeout(() => {
        t.classList.add(evaluation[i]);
      }, i * 150);
    });

    this.guesses.push(guess);
    this.currentGuess = '';
    this.renderKeyboard();

    setTimeout(() => {
      if (guess === target) {
        this.victory();
      } else if (this.guesses.length >= this.maxGuesses) {
        this.defeat();
      } else {
        this.attemptEl.innerText = this.guesses.length + 1;
        this.msgEl.innerText = 'Keep going!';
        this.msgEl.style.color = 'var(--cyan-primary)';
      }
    }, 1000);
  }

  victory() {
    this.gameOverState = true;
    if (window.soundEngine) window.soundEngine.playVictory();
    if (window.confettiEngine) window.confettiEngine.fire(90);

    const attempts = this.guesses.length;
    const score = Math.round(1800 - (attempts - 1) * 250);

    this.onComplete({
      gameId: 'wordle',
      score,
      domain: 'logic',
      accuracy: `Guessed in ${attempts}/6 tries`,
      details: `Word: ${this.targetWord}`,
      performanceRatio: (7 - attempts) / 6
    });
  }

  defeat() {
    this.gameOverState = true;
    if (window.soundEngine) window.soundEngine.playError();
    this.msgEl.innerText = `The word was ${this.targetWord}`;
    this.msgEl.style.color = 'var(--crimson-alert)';

    setTimeout(() => {
      this.onComplete({
        gameId: 'wordle',
        score: 200,
        domain: 'logic',
        accuracy: '0/6 tries',
        details: `The hidden word was ${this.targetWord}`,
        performanceRatio: 0.2
      });
    }, 1500);
  }

  destroy() {
    if (this.keyHandler) window.removeEventListener('keydown', this.keyHandler);
  }
}

/* ==========================================================================
   NEUROLAB - Game 12: Mental Rotation (3D Spatial IQ)
   Shepard & Metzler canonical 3D mental rotation & spatial transformation task
   ========================================================================== */

class MentalRotationGame {
  constructor(container, onComplete) {
    this.container = container;
    this.onComplete = onComplete;
    this.totalRounds = 5;
    this.currentRound = 0;
    this.score = 0;
    this.correctCount = 0;
    this.startTime = null;

    this.render();
    this.startRound();
  }

  render() {
    this.container.innerHTML = `
      <div class="game-stage-wrapper">
        <div class="rotation-container">
          <div class="nback-status-pill">
            <span>Round: <strong id="rot-round">1</strong> / ${this.totalRounds}</span>
            <span>Score: <strong id="rot-score">0</strong></span>
            <span>Accuracy: <strong id="rot-acc" style="color:var(--cyan-primary)">100%</strong></span>
          </div>

          <div class="rotation-reference-card">
            <span class="rotation-reference-label">Reference 3D Object</span>
            <canvas class="rotation-canvas" id="rot-ref-canvas" width="160" height="160"></canvas>
          </div>

          <div style="font-size:0.85rem; color:var(--text-secondary); text-align:center;">
            Which of the 4 objects below is an <strong>exact 3D rotation</strong> of the reference object?
          </div>

          <div class="rotation-candidates-grid" id="rot-candidates">
            <!-- 4 candidate cards -->
          </div>
        </div>
      </div>
    `;

    this.roundEl = this.container.querySelector('#rot-round');
    this.scoreEl = this.container.querySelector('#rot-score');
    this.accEl = this.container.querySelector('#rot-acc');
    this.refCanvas = this.container.querySelector('#rot-ref-canvas');
    this.candidatesEl = this.container.querySelector('#rot-candidates');
  }

  /* Procedural 3D polycube generation */
  generateShape() {
    // Sequence of 3D cubes connected along orthogonal axes [x, y, z]
    const cubes = [{ x: 0, y: 0, z: 0 }];
    const dirs = [
      { x: 1, y: 0, z: 0 }, { x: -1, y: 0, z: 0 },
      { x: 0, y: 1, z: 0 }, { x: 0, y: -1, z: 0 },
      { x: 0, y: 0, z: 1 }, { x: 0, y: 0, z: -1 }
    ];

    while (cubes.length < 5) {
      const parent = cubes[cubes.length - 1];
      const d = dirs[Math.floor(Math.random() * dirs.length)];
      const next = { x: parent.x + d.x, y: parent.y + d.y, z: parent.z + d.z };

      // Avoid self-overlap
      if (!cubes.some(c => c.x === next.x && c.y === next.y && c.z === next.z)) {
        cubes.push(next);
      }
    }
    return cubes;
  }

  // 3D 90-deg step rotations
  rotate3D(cubes, rx, ry, rz) {
    let res = cubes.map(c => ({ ...c }));

    // X-axis rotation
    for (let i = 0; i < rx % 4; i++) {
      res = res.map(c => ({ x: c.x, y: -c.z, z: c.y }));
    }
    // Y-axis rotation
    for (let i = 0; i < ry % 4; i++) {
      res = res.map(c => ({ x: c.z, y: c.y, z: -c.x }));
    }
    // Z-axis rotation
    for (let i = 0; i < rz % 4; i++) {
      res = res.map(c => ({ x: -c.y, y: c.x, z: c.z }));
    }
    return res;
  }

  // Mirror flip (creates chiral enantiomer that cannot be rotated into match)
  mirrorFlip(cubes) {
    return cubes.map(c => ({ x: -c.x, y: c.y, z: c.z }));
  }

  startRound() {
    this.startTime = Date.now();
    this.roundEl.innerText = this.currentRound + 1;

    const baseShape = this.generateShape();
    this.drawIsometric(this.refCanvas, baseShape, '#00f0ff');

    // 1 Correct rotation, 3 False (mirrored or altered)
    const candidates = [];

    // Correct rotated candidate
    const correctRot = this.rotate3D(
      baseShape,
      1 + Math.floor(Math.random() * 3),
      1 + Math.floor(Math.random() * 3),
      Math.floor(Math.random() * 4)
    );
    candidates.push({ shape: correctRot, isMatch: true });

    // 3 Distractors (mirrored and rotated)
    for (let i = 0; i < 3; i++) {
      const mirrored = this.mirrorFlip(baseShape);
      const fakeRot = this.rotate3D(
        mirrored,
        Math.floor(Math.random() * 4),
        Math.floor(Math.random() * 4),
        Math.floor(Math.random() * 4)
      );
      candidates.push({ shape: fakeRot, isMatch: false });
    }

    // Shuffle candidates
    candidates.sort(() => 0.5 - Math.random());

    this.candidatesEl.innerHTML = '';
    candidates.forEach((cand, i) => {
      const card = document.createElement('div');
      card.className = 'rotation-card';

      const canvas = document.createElement('canvas');
      canvas.className = 'rotation-canvas';
      canvas.width = 130;
      canvas.height = 130;
      this.drawIsometric(canvas, cand.shape, '#8b5cf6');

      const label = document.createElement('span');
      label.style.fontSize = '0.75rem';
      label.style.color = 'var(--text-muted)';
      label.style.marginTop = '0.5rem';
      label.innerText = `Option ${String.fromCharCode(65 + i)}`;

      card.appendChild(canvas);
      card.appendChild(label);

      card.addEventListener('click', () => this.handlePick(card, cand.isMatch));
      this.candidatesEl.appendChild(card);
    });
  }

  drawIsometric(canvas, cubes, primaryColor) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);

    const size = 18;
    const cos30 = Math.cos(Math.PI / 6);
    const sin30 = Math.sin(Math.PI / 6);

    // Center coordinates
    const cx = w / 2;
    const cy = h / 2 + 10;

    // Sort cubes back-to-front by depth (x + y - z)
    const sorted = [...cubes].sort((a, b) => (a.x + a.y - a.z) - (b.x + b.y - b.z));

    sorted.forEach(c => {
      // Isometric projection
      const px = cx + (c.x - c.y) * size * cos30;
      const py = cy + (c.x + c.y) * size * sin30 - c.z * size;

      this.drawCube(ctx, px, py, size, primaryColor);
    });
  }

  drawCube(ctx, x, y, s, color) {
    const cos30 = Math.cos(Math.PI / 6);
    const sin30 = Math.sin(Math.PI / 6);

    // Top face
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.lineTo(x + s * cos30, y - s + s * sin30);
    ctx.lineTo(x, y - s + 2 * s * sin30);
    ctx.lineTo(x - s * cos30, y - s + s * sin30);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Left face
    ctx.beginPath();
    ctx.moveTo(x - s * cos30, y - s + s * sin30);
    ctx.lineTo(x, y - s + 2 * s * sin30);
    ctx.lineTo(x, y + s * sin30);
    ctx.lineTo(x - s * cos30, y);
    ctx.closePath();
    ctx.fillStyle = '#0f172a';
    ctx.globalAlpha = 0.95;
    ctx.fill();
    ctx.stroke();

    // Right face
    ctx.beginPath();
    ctx.moveTo(x + s * cos30, y - s + s * sin30);
    ctx.lineTo(x, y - s + 2 * s * sin30);
    ctx.lineTo(x, y + s * sin30);
    ctx.lineTo(x + s * cos30, y);
    ctx.closePath();
    ctx.fillStyle = '#1e293b';
    ctx.globalAlpha = 0.95;
    ctx.fill();
    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  handlePick(card, isMatch) {
    const elapsed = Date.now() - this.startTime;

    if (isMatch) {
      this.correctCount++;
      card.style.borderColor = 'var(--emerald-primary)';
      card.style.boxShadow = '0 0 25px var(--emerald-glow)';
      const pts = Math.max(100, Math.round(500 - elapsed / 25));
      this.score += pts;
      if (window.soundEngine) window.soundEngine.playSuccess();
    } else {
      card.style.borderColor = 'var(--crimson-alert)';
      card.style.boxShadow = '0 0 25px rgba(239, 68, 68, 0.5)';
      if (window.soundEngine) window.soundEngine.playError();
    }

    this.scoreEl.innerText = this.score;
    this.currentRound++;
    const acc = Math.round((this.correctCount / this.currentRound) * 100);
    this.accEl.innerText = `${acc}%`;

    setTimeout(() => {
      if (this.currentRound >= this.totalRounds) {
        this.gameOver();
      } else {
        this.startRound();
      }
    }, 900);
  }

  gameOver() {
    if (window.confettiEngine && this.score > 1200) {
      window.confettiEngine.fire(90);
      window.soundEngine.playVictory();
    }

    this.onComplete({
      gameId: 'mental-rotation',
      score: this.score,
      domain: 'spatial',
      accuracy: `${this.correctCount}/${this.totalRounds} Correct`,
      details: 'Evaluated 3D parietal mental rotation vectors',
      performanceRatio: this.correctCount / this.totalRounds
    });
  }

  destroy() {}
}

window.MentalRotationGame = MentalRotationGame;

</script>
</head>
<body>
  <h1>🧠 NEUROLAB QA Automated Test Suite</h1>
  <p style="color:#94a3b8; margin-bottom:1.5rem;">Automated validation of State, Radar, Audio, Synthesizers, and all 12 Cognitive Game Engines.</p>

  <div class="qa-stats">
    <div class="stat-badge">
      <span>Total Tests</span>
      <strong id="total-tests">0</strong>
    </div>
    <div class="stat-badge">
      <span class="passed">Passed</span>
      <strong id="passed-tests" class="passed">0</strong>
    </div>
    <div class="stat-badge">
      <span class="failed">Failed</span>
      <strong id="failed-tests" class="failed">0</strong>
    </div>
    <div class="stat-badge">
      <span>Status</span>
      <strong id="test-status" style="color:#00f0ff;">RUNNING...</strong>
    </div>
  </div>

  <div class="test-log" id="test-log"></div>

  <!-- Hidden mount sandbox for game instances -->
  <div id="sandbox"></div>

  <script>
    const logEl = document.getElementById('test-log');
    const totalEl = document.getElementById('total-tests');
    const passedEl = document.getElementById('passed-tests');
    const failedEl = document.getElementById('failed-tests');
    const statusEl = document.getElementById('test-status');
    const sandbox = document.getElementById('sandbox');

    let total = 0;
    let passed = 0;
    let failed = 0;

    function assert(name, condition, details = '') {
      total++;
      const item = document.createElement('div');
      item.className = 'test-item';

      if (condition) {
        passed++;
        item.innerHTML = `<span class="badge-pass">PASS</span> <strong>${name}</strong> ${details ? '<span style="color:#94a3b8;">- ' + details + '</span>' : ''}`;
        console.log(`[PASS] ${name}`);
      } else {
        failed++;
        item.innerHTML = `<span class="badge-fail">FAIL</span> <strong>${name}</strong> ${details ? '<span style="color:#ef4444;">- ' + details + '</span>' : ''}`;
        console.error(`[FAIL] ${name}: ${details}`);
      }

      logEl.appendChild(item);
      totalEl.innerText = total;
      passedEl.innerText = passed;
      failedEl.innerText = failed;
    }

    async function runQA() {
      console.log('--- Starting NEUROLAB QA Suite ---');

      // 1. Audio Engine Test
      try {
        assert('SoundEngine is instantiated', !!window.soundEngine);
        assert('SoundEngine mute toggle works', typeof window.soundEngine.toggleMute === 'function');
        const origMute = window.soundEngine.isMuted();
        window.soundEngine.toggleMute();
        assert('SoundEngine toggles state properly', window.soundEngine.isMuted() !== origMute);
        window.soundEngine.toggleMute(); // restore
      } catch (err) {
        assert('SoundEngine Test', false, err.message);
      }

      // 2. Confetti Engine Test
      try {
        assert('ConfettiEngine is instantiated', !!window.confettiEngine);
        assert('Confetti fire method exists', typeof window.confettiEngine.fire === 'function');
      } catch (err) {
        assert('ConfettiEngine Test', false, err.message);
      }

      // 3. BrainState Persistence & Algorithm Test
      try {
        assert('BrainState is instantiated', !!window.brainState);
        assert('BrainState has default NQ within standard range (800-1600)', window.brainState.data.nq >= 800 && window.brainState.data.nq <= 1600);
        assert('BrainState has 5 cognitive domains defined', Object.keys(window.brainState.data.domains).length === 5);
        
        const recordRes = window.brainState.recordGame('test-game', 950, 'memory', 0.9);
        assert('BrainState records score and calculates NQ', recordRes.nq >= 800);
        assert('BrainState retrieves recorded high score', window.brainState.getHighScore('test-game') === 950);
      } catch (err) {
        assert('BrainState Test', false, err.message);
      }

      // 4. Test Game 1: Dual N-Back
      try {
        sandbox.innerHTML = '';
        const nback = new DualNBackGame(sandbox, () => {});
        assert('Dual N-Back initialises with 9 grid cells', sandbox.querySelectorAll('.nback-cell').length === 9);
        assert('Dual N-Back controls exist (Visual & Audio)', !!sandbox.querySelector('#btn-pos-match') && !!sandbox.querySelector('#btn-audio-match'));
        nback.handlePosMatch();
        assert('Dual N-Back handles visual match input', nback.userPosMatched === true);
        nback.destroy();
      } catch (err) {
        assert('Dual N-Back Test', false, err.message);
      }

      // 5. Test Game 2: Chimp Test
      try {
        sandbox.innerHTML = '';
        const chimp = new ChimpTestGame(sandbox, () => {});
        assert('Chimp Test creates 40 cells (8x5 board)', sandbox.querySelectorAll('.chimp-cell').length === 40);
        assert('Chimp Test spawns starting tiles equal to level', chimp.tiles.length === chimp.level);
        const tile1 = chimp.tiles.find(t => t.innerText === '1');
        assert('Chimp Test finds tile #1', !!tile1);
        chimp.handleTileClick(tile1, 1);
        assert('Chimp Test masks remaining tiles after click 1', chimp.isMasked === true);
        chimp.destroy();
      } catch (err) {
        assert('Chimp Test', false, err.message);
      }

      // 6. Test Game 3: Stroop Color Clash
      try {
        sandbox.innerHTML = '';
        const stroop = new StroopGame(sandbox, () => {});
        assert('Stroop displays word and ink color', !!sandbox.querySelector('#stroop-word'));
        assert('Stroop creates 4 color choice buttons', sandbox.querySelectorAll('.btn-stroop-color').length === 4);
        const curInk = stroop.currentInkColor;
        stroop.handleAnswer(curInk);
        assert('Stroop correctly evaluates matching ink color', stroop.score > 0 && stroop.streak === 1);
        stroop.destroy();
      } catch (err) {
        assert('Stroop Test', false, err.message);
      }

      // 7. Test Game 4: Schulte Grid
      try {
        sandbox.innerHTML = '';
        const schulte = new SchulteGridGame(sandbox, () => {});
        assert('Schulte Grid populates exactly 25 tiles', sandbox.querySelectorAll('.schulte-tile').length === 25);
        assert('Schulte Grid targets #1 first', schulte.nextTarget === 1);
        const sTile1 = Array.from(sandbox.querySelectorAll('.schulte-tile')).find(t => t.dataset.num === '1');
        schulte.handleTileClick(sTile1, 1);
        assert('Schulte Grid advances target to #2 on click', schulte.nextTarget === 2 && sTile1.classList.contains('found'));
        schulte.destroy();
      } catch (err) {
        assert('Schulte Grid Test', false, err.message);
      }

      // 8. Test Game 5: Memory Matrix
      try {
        sandbox.innerHTML = '';
        const matrix = new MemoryMatrixGame(sandbox, () => {});
        assert('Memory Matrix initialises 3x3 (9 cells)', sandbox.querySelectorAll('.matrix-cell').length === 9);
        assert('Memory Matrix selects target cells', matrix.targetCells.size === matrix.activeCount);
        matrix.destroy();
      } catch (err) {
        assert('Memory Matrix Test', false, err.message);
      }

      // 9. Test Game 6: Simon Sequence
      try {
        sandbox.innerHTML = '';
        const simon = new SimonGame(sandbox, () => {});
        assert('Simon Sequence has 4 interactive pads', sandbox.querySelectorAll('.simon-pad').length === 4);
        assert('Simon starts with at least 1 sequence item', simon.sequence.length >= 1);
        simon.destroy();
      } catch (err) {
        assert('Simon Sequence Test', false, err.message);
      }

      // 10. Test Game 7: Tower of Hanoi
      try {
        sandbox.innerHTML = '';
        const hanoi = new TowerHanoiGame(sandbox, () => {});
        assert('Tower of Hanoi has 3 rods', hanoi.rods.length === 3);
        assert('Tower of Hanoi rod 0 starts with all disks', hanoi.rods[0].length === hanoi.diskCount);
        assert('Optimal moves calculation formula (2^n - 1)', hanoi.optimalMoves === Math.pow(2, hanoi.diskCount) - 1);
        hanoi.rods = [[3], [1], []];
        hanoi.selectedRod = 0;
        hanoi.handleRodClick(1);
        assert('Tower of Hanoi blocks illegal move (larger on smaller)', hanoi.rods[0].length === 1 && hanoi.rods[1].length === 1);
        hanoi.destroy();
      } catch (err) {
        assert('Tower of Hanoi Test', false, err.message);
      }

      // 11. Test Game 8: 2048 Neon Fusion
      try {
        sandbox.innerHTML = '';
        const g2048 = new Game2048(sandbox, () => {});
        assert('2048 board has 16 cells (4x4)', sandbox.querySelectorAll('.game2048-cell').length === 16);
        let nonZero = 0;
        g2048.grid.forEach(r => r.forEach(v => { if (v > 0) nonZero++; }));
        assert('2048 spawns initial tiles', nonZero >= 2);
        g2048.destroy();
      } catch (err) {
        assert('2048 Test', false, err.message);
      }

      // 12. Test Game 9: Speed Math Frenzy
      try {
        sandbox.innerHTML = '';
        const math = new SpeedMathGame(sandbox, () => {});
        assert('Speed Math generates equation', !!sandbox.querySelector('#math-equation').innerText);
        assert('Speed Math provides 4 distinct answer choices', sandbox.querySelectorAll('.btn-math-opt').length === 4);
        math.handleChoice(math.correctAnswer);
        assert('Speed Math awards score and streak on correct answer', math.score > 0 && math.streak === 1);
        math.destroy();
      } catch (err) {
        assert('Speed Math Test', false, err.message);
      }

      // 13. Test Game 10: Lights Out
      try {
        sandbox.innerHTML = '';
        const lights = new LightsOutGame(sandbox, () => {});
        assert('Lights Out creates 25 nodes (5x5)', sandbox.querySelectorAll('.light-tile').length === 25);
        const preFlip = lights.board[0][0];
        lights.toggle(0, 0);
        assert('Lights Out toggles target and adjacent nodes', lights.board[0][0] !== preFlip);
        lights.destroy();
      } catch (err) {
        assert('Lights Out Test', false, err.message);
      }

      // 14. Test Game 11: Wordle Master
      try {
        sandbox.innerHTML = '';
        const wordle = new WordleGame(sandbox, () => {});
        assert('Wordle creates 6 rows of 5 tiles', sandbox.querySelectorAll('.wordle-row').length === 6);
        assert('Wordle creates on-screen keyboard', sandbox.querySelectorAll('.wordle-key').length > 20);
        wordle.addLetter('B');
        wordle.addLetter('R');
        assert('Wordle accepts letter inputs into current guess', wordle.currentGuess === 'BR');
        wordle.removeLetter();
        assert('Wordle removes letter on backspace', wordle.currentGuess === 'B');
        wordle.destroy();
      } catch (err) {
        assert('Wordle Test', false, err.message);
      }

      // 15. Test Game 12: Mental Rotation
      try {
        sandbox.innerHTML = '';
        const rot = new MentalRotationGame(sandbox, () => {});
        assert('Mental Rotation generates reference shape', typeof rot.generateShape === 'function');
        const shape = rot.generateShape();
        assert('Mental Rotation shape contains 5 connected 3D cubes', shape.length === 5);
        const rotated = rot.rotate3D(shape, 1, 0, 0);
        assert('Mental Rotation rotates cubes in 3D space', rotated.length === 5);
        const mirrored = rot.mirrorFlip(shape);
        assert('Mental Rotation generates chiral enantiomer (mirror)', mirrored.length === 5);
        assert('Mental Rotation renders 4 candidate options', sandbox.querySelectorAll('.rotation-card').length === 4);
        rot.destroy();
      } catch (err) {
        assert('Mental Rotation Test', false, err.message);
      }

      // Final status
      if (failed === 0) {
        statusEl.innerText = 'ALL PASSED (100%)';
        statusEl.style.color = '#10b981';
      } else {
        statusEl.innerText = `${failed} FAILED`;
        statusEl.style.color = '#ef4444';
      }

      console.log(`QA Completed: ${passed} passed, ${failed} failed out of ${total} total assertions.`);
    }

    window.addEventListener('load', runQA);
  </script>
